[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projectfisheries"
version = "0.1.0"
description = "ProjectFisheries —— 水产养殖智能监测与决策 Agent"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.17"]
# 只做推理（加载 models/yolov8-fish.pt）时够用；要自己训练权重装下面的 train。
vision = ["ultralytics>=8.2"]
# 训练病害识别四分类权重（scripts/train_yolo_fish.py），见 docs/模型训练说明.md。
# ⚠ torch 的 cu128 wheel 不在 PyPI 上，必须显式指定官方索引：
#     pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
# 额外依赖里没法写 index-url，所以这里只声明版本，索引由命令给。
# Blackwell（sm_120，如 RTX 50 系）必须用 cu128，否则一推理就报
# "no kernel image is available for execution"。
train = ["torch>=2.7", "torchvision>=0.22", "ultralytics>=8.2"]
data = ["pandas>=2.2", "numpy>=1.26"]
# 数据集按需导入（`python scripts/fetch_datasets.py pull`）才需要。
# 工程默认不带数据集：仓库里只有代码，1.37 GB 的原始数据放在工程外。
datasets = ["kagglehub>=0.3"]
# 接口服务（FastAPI）。装了它才有 HTTP 接口，也才由它托管 web/ 里的前端页面。
# ⚠ python-multipart 不是可选项：POST /api/v1/ingest/image 用的是 multipart 表单，
#   缺了它在**导入期**就抛 RuntimeError，服务根本起不来。
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
# 检索层（RAG）：向量库 + 稀疏检索 + 中文分词 + 语料 front-matter 解析。
# 不装这些接口照样能起，只是知识库状态变成 unavailable、/chat 返回 503
# （见 src/fisheries/api/deps.py 的 _prepare_knowledge）。
rag = [
    "langchain-core>=0.3",
    "langchain-chroma>=0.2",
    "chromadb>=0.5",
    "fastembed>=0.4",
    "rank-bm25>=0.2",
    "jieba>=0.42",
    "pyyaml>=6.0",
]
# 离线回译（D12）：把 AQUA-7B 的整句英文译成中文，不联网、不需要 key。
# 权重不在 PyPI 上，用 `python scripts/fetch_translate_model.py` 下到
# models/translate/。没装这个 extra 也能跑，只是回译退回受控词表，
# 自由长句会整条退回中文模板（D12 的收益拿不到）。
# ⚠ transformers 必须 >=4.44：更早的版本不支持这里用的 Marian 加载路径。
# ⚠ 不要固定到 5.x 之前——实测装的 5.19.0 可用；transformers 5 把
#    AutoModelForSeq2SeqLM 的返回类型改了，但 .generate() 接口没变。
translate = ["transformers>=4.44", "sentencepiece>=0.2", "sacremoses>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

# --------------------------------------------------------------------------- #
# pytest 配置：让 tests/ 下可以直接 import fisheries，无需安装包
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
# integration 标记用于「真模型 + 真知识库」的 P0 端到端用例：
#   pytest -m "not integration"   只跑单元测试（默认推荐，秒级）
#   pytest -m integration         只跑集成测试（几十秒，缺权重/缺索引会 skip）
#   pytest                        两者都跑
markers = [
    "integration: 端到端集成测试：真模型/真知识库/真路由，缺权重或缺索引时 skip",
]

# --------------------------------------------------------------------------- #
# ruff 配置：静态检查（不格式化，见 .editorconfig 与现有缩进风格）
#   python -m ruff check          查全部
#   python -m ruff check --fix    自动修可修的（RUF100 / F541 / I001 这类等价改写）
# 规则集是「基础但能抓到真错」的一档，不含 flake8-bandit(S)/pydocstyle(D)：
#   - S101 会对 1200+ 条单测的 assert 全部报错，噪声远大于收益；
#   - D 会要求给每个私有函数补 docstring，本工程用中文分区注释组织代码。
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle 的硬错误子集（未定义名之外的真错）
    "F",               # pyflakes：未定义名、未用导入、f-string 无占位符
    "W",               # pycodestyle 空白告警（行尾空格、多余空行）
    "I",               # import 排序与分组
    "UP",              # pyupgrade：过时写法（% 格式化、encoding 声明等）
    "B",               # bugbear：可变默认参数、zip 不严格等真 bug 候选
    "SIM",             # 可简化的等价写法
    "RUF",             # ruff 自带规则（noqa 是否多余、__all__ 是否有序）
    "PERF",            # 明显的性能问题（能改成推导式的循环）
    "C4",              # 推导式写法
    "PYI",             # 类型标注风格
    "PLW",             # pylint 的告警子集（subprocess 不检查返回码等）
    "BLE",             # 盲目的 except Exception
]
ignore = [
    # 中文全角标点、汉字宽度、同形字：提示语和文档字符串里是刻意的，不是笔误。
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 测试里 assert 就是断言机制，B017（用 assertRaises(Exception)）在这里挡不住真错。
"tests/**" = ["B017"]
